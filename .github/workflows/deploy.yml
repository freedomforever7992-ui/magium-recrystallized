name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724'

      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk"

      - name: Install dependencies
        run: npm ci

      - name: Check Tauri
        run: |
          npx tauri --version
          npx tauri info

      - name: Build WASM
        run: npm run wasm

      - name: Initialize Tauri Android
        run: |
          set -o pipefail
          npx tauri android init --ci --verbose 2>&1 | tee android-init.log

      - name: Inspect Android initialization
        run: |
          echo "===== ANDROID INIT LOG ====="
          cat android-init.log

          echo ""
          echo "===== SRC-TAURI ====="
          find src-tauri -maxdepth 4 -type d -print

          echo ""
          echo "===== GEN DIRECTORY ====="
          if [ -d "src-tauri/gen" ]; then
            ls -la src-tauri/gen
          else
            echo "src-tauri/gen DOES NOT EXIST"
          fi

          echo ""
          echo "===== ANDROID DIRECTORY ====="
          if [ -d "src-tauri/gen/android" ]; then
            echo "ANDROID PROJECT FOUND"
            find src-tauri/gen/android -maxdepth 2 -type f | head -100
          else
            echo "ANDROID PROJECT NOT FOUND"
          fi

      - name: Stop if Android project is missing
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "ERROR: Tauri did not create src-tauri/gen/android"
            exit 1
          fi

      - name: Build APK
        run: npx tauri android build --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magium-recrystallized-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
