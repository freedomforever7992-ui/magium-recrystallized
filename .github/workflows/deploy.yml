name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724'

      - name: Install dependencies
        run: npm ci

      - name: Build WASM
        run: npm run wasm

      - name: Initialize Tauri Android
        run: npm run tauri android init -- --ci

      - name: Verify Android project
        run: |
          echo "Checking Android project..."
          ls -la src-tauri/gen/android
          echo "Android project found successfully."

      - name: Build APK
        run: npm run tauri android build -- --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magium-recrystallized-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
